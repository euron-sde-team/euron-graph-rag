name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security issues: do not file here**, follow SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: If extraction, communities or a question are involved, include the project's graph settings and the question or document, with private content removed. The query id (GET .../queries/{id}) and the request id from the error help too.
      placeholder: |
        1. make up && make demo
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ingestion (parsing, cleaning, chunking)
        - Embeddings
        - Entity and relation extraction
        - Entity resolution and merging
        - Communities and reports
        - Search and citations
        - Graph explorer
        - Dashboard
        - CLI
        - API
        - Deployment
        - Other
  - type: dropdown
    id: answerer
    attributes:
      label: Answer provider
      options: [Local (built-in), OpenAI-compatible, Ollama, Not provider specific]
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options: [Local (Floci), Local against AWS, AWS (Terraform), Self-hosted (other), Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact keys, tokens, passwords, hostnames and private document text before pasting.
      render: text
