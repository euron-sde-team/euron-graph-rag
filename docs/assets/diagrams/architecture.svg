<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="t d">
<title id="t">GraphRAG architecture</title><desc id="d">Documents flow through parse, extract and build stages into PostgreSQL; questions are answered by local, global and hybrid search over the same store.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#696e80"/></marker></defs>
<rect width="1280" height="520" rx="16" fill="#f8f8fc"/>
<g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<text x="40" y="44" font-size="13" font-weight="600" fill="#4338ca" letter-spacing="1.5">INGEST</text>
<rect x="40" y="64" width="170" height="72" rx="12" fill="var(--card, #ffffff)" stroke="#4338ca" stroke-width="2"/><text x="125.0" y="96.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14142b">Documents</text><text x="125.0" y="116.0" text-anchor="middle" font-size="12" fill="#5a5d73">files, text, URLs</text>
<rect x="250" y="64" width="170" height="72" rx="12" fill="var(--card, #ffffff)" stroke="#4338ca" stroke-width="2"/><text x="335.0" y="96.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14142b">Parse and chunk</text><text x="335.0" y="116.0" text-anchor="middle" font-size="12" fill="#5a5d73">sections, passages</text>
<rect x="460" y="64" width="170" height="72" rx="12" fill="var(--card, #ffffff)" stroke="#4338ca" stroke-width="2"/><text x="545.0" y="96.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14142b">Embed</text><text x="545.0" y="116.0" text-anchor="middle" font-size="12" fill="#5a5d73">cached, per project</text>
<rect x="670" y="64" width="170" height="72" rx="12" fill="var(--card, #ffffff)" stroke="#0f766e" stroke-width="2"/><text x="755.0" y="96.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14142b">Extract</text><text x="755.0" y="116.0" text-anchor="middle" font-size="12" fill="#5a5d73">entities and relations</text>
<rect x="880" y="64" width="170" height="72" rx="12" fill="var(--card, #ffffff)" stroke="#0f766e" stroke-width="2"/><text x="965.0" y="96.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14142b">Resolve</text><text x="965.0" y="116.0" text-anchor="middle" font-size="12" fill="#5a5d73">aliases, merges</text>
<rect x="1090" y="64" width="150" height="72" rx="12" fill="var(--card, #ffffff)" stroke="#0f766e" stroke-width="2"/><text x="1165.0" y="96.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14142b">Communities</text><text x="1165.0" y="116.0" text-anchor="middle" font-size="12" fill="#5a5d73">levels and reports</text>
<line x1="210" y1="100" x2="250" y2="100" stroke="#696e80" stroke-width="2" marker-end="url(#a)"/>
<line x1="420" y1="100" x2="460" y2="100" stroke="#696e80" stroke-width="2" marker-end="url(#a)"/>
<line x1="630" y1="100" x2="670" y2="100" stroke="#696e80" stroke-width="2" marker-end="url(#a)"/>
<line x1="840" y1="100" x2="880" y2="100" stroke="#696e80" stroke-width="2" marker-end="url(#a)"/>
<line x1="1050" y1="100" x2="1090" y2="100" stroke="#696e80" stroke-width="2" marker-end="url(#a)"/>
<text x="40" y="206" font-size="13" font-weight="600" fill="#4338ca" letter-spacing="1.5">STORE</text>
<rect x="40" y="222" width="1200" height="110" rx="14" fill="#eceefe" stroke="#c7d2fe" stroke-width="2"/>
<text x="640" y="250" text-anchor="middle" font-size="16" font-weight="600" fill="#312e81">PostgreSQL 16 with pgvector</text>
<rect x="64" y="264" width="214" height="54" rx="9" fill="#ffffff" stroke="#c7d2fe"/><text x="171" y="287" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14142b">documents, chunks</text><text x="171" y="306" text-anchor="middle" font-size="11.5" fill="#5a5d73">tsvector, HNSW</text>
<rect x="298" y="264" width="214" height="54" rx="9" fill="#ffffff" stroke="#c7d2fe"/><text x="405" y="287" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14142b">entities, mentions</text><text x="405" y="306" text-anchor="middle" font-size="11.5" fill="#5a5d73">aliases, HNSW</text>
<rect x="532" y="264" width="214" height="54" rx="9" fill="#ffffff" stroke="#c7d2fe"/><text x="639" y="287" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14142b">relations, evidence</text><text x="639" y="306" text-anchor="middle" font-size="11.5" fill="#5a5d73">weights from rows</text>
<rect x="766" y="264" width="214" height="54" rx="9" fill="#ffffff" stroke="#c7d2fe"/><text x="873" y="287" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14142b">communities, members</text><text x="873" y="306" text-anchor="middle" font-size="11.5" fill="#5a5d73">reports, HNSW</text>
<rect x="1000" y="264" width="214" height="54" rx="9" fill="#ffffff" stroke="#c7d2fe"/><text x="1107" y="287" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14142b">builds, queries</text><text x="1107" y="306" text-anchor="middle" font-size="11.5" fill="#5a5d73">history, traces</text>
<line x1="125" y1="136" x2="125" y2="222" stroke="#696e80" stroke-width="2" marker-end="url(#a)"/>
<line x1="965" y1="136" x2="965" y2="222" stroke="#696e80" stroke-width="2" marker-end="url(#a)"/>
<text x="40" y="384" font-size="13" font-weight="600" fill="#4338ca" letter-spacing="1.5">ANSWER</text>
<rect x="40" y="404" width="230" height="78" rx="12" fill="var(--card, #ffffff)" stroke="#b45309" stroke-width="2"/><text x="155.0" y="439.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14142b">Local search</text><text x="155.0" y="459.0" text-anchor="middle" font-size="12" fill="#5a5d73">seeds, hops, passages</text>
<rect x="300" y="404" width="230" height="78" rx="12" fill="var(--card, #ffffff)" stroke="#b45309" stroke-width="2"/><text x="415.0" y="439.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14142b">Global search</text><text x="415.0" y="459.0" text-anchor="middle" font-size="12" fill="#5a5d73">map and reduce reports</text>
<rect x="560" y="404" width="230" height="78" rx="12" fill="var(--card, #ffffff)" stroke="#b45309" stroke-width="2"/><text x="675.0" y="439.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14142b">Hybrid</text><text x="675.0" y="459.0" text-anchor="middle" font-size="12" fill="#5a5d73">both, one answer</text>
<rect x="840" y="404" width="400" height="78" rx="12" fill="var(--card, #ffffff)" stroke="#b45309" stroke-width="2"/><text x="1040.0" y="439.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14142b">Answer with citations</text><text x="1040.0" y="459.0" text-anchor="middle" font-size="12" fill="#5a5d73">sources, subgraph, communities, trace</text>
<line x1="155" y1="332" x2="155" y2="404" stroke="#696e80" stroke-width="2" marker-end="url(#a)"/>
<line x1="415" y1="332" x2="415" y2="404" stroke="#696e80" stroke-width="2" marker-end="url(#a)"/>
<line x1="675" y1="332" x2="675" y2="404" stroke="#696e80" stroke-width="2" marker-end="url(#a)"/>
<line x1="790" y1="443" x2="840" y2="443" stroke="#696e80" stroke-width="2" marker-end="url(#a)"/>
</g></svg>
