# Euron GraphRAG: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports (override in .env if they clash with something you already run):
#   web 3200   api 8200   postgres 5460   valkey 6420   floci 4620
name: graphrag

x-app-env: &app-env
  # Development mode: the local stack talks to an emulator and links to localhost, both of
  # which production refuses on purpose (Settings.production_problems).
  APP_ENV: development
  TZ: UTC
  LOG_LEVEL: ${GRAPHRAG_LOG_LEVEL:-info}
  LOG_FORMAT: json
  PRODUCT_NAME: ${GRAPHRAG_PRODUCT_NAME:-Euron GraphRAG}
  DATABASE_URL: postgresql+asyncpg://graphrag:graphrag@postgres:5432/graphrag
  REDIS_URL: redis://valkey:6379/0
  SESSION_SECRET: ${GRAPHRAG_SESSION_SECRET:?run `make env` first}
  API_KEY_PEPPER: ${GRAPHRAG_API_KEY_PEPPER:?run `make env` first}
  CORS_ORIGINS: http://localhost:${GRAPHRAG_WEB_PORT:-3200},http://127.0.0.1:${GRAPHRAG_WEB_PORT:-3200}
  WEB_URL: http://localhost:${GRAPHRAG_WEB_PORT:-3200}
  API_URL: http://localhost:${GRAPHRAG_API_PORT:-8200}
  # The local providers are deterministic and need no model or key: the extractor, the
  # embedder, the community summarizer and the answer composer all run in process. To use a
  # model instead, set GRAPHRAG_LLM_PROVIDER=ollama (Ollama on this machine) or openai (any
  # OpenAI-compatible API) with GRAPHRAG_LLM_MODEL, and likewise for embeddings.
  LLM_PROVIDER: ${GRAPHRAG_LLM_PROVIDER:-local}
  LLM_MODEL: ${GRAPHRAG_LLM_MODEL:-}
  LLM_BASE_URL: ${GRAPHRAG_LLM_BASE_URL:-https://api.openai.com/v1}
  LLM_API_KEY: ${GRAPHRAG_LLM_API_KEY:-}
  EMBEDDING_PROVIDER: ${GRAPHRAG_EMBEDDING_PROVIDER:-local}
  EMBEDDING_MODEL: ${GRAPHRAG_EMBEDDING_MODEL:-}
  EMBEDDING_DIM: ${GRAPHRAG_EMBEDDING_DIM:-384}
  EMBEDDINGS_API_BASE: ${GRAPHRAG_EMBEDDINGS_API_BASE:-https://api.openai.com/v1}
  EMBEDDINGS_API_KEY: ${GRAPHRAG_EMBEDDINGS_API_KEY:-}
  OLLAMA_URL: ${GRAPHRAG_OLLAMA_URL:-http://host.docker.internal:11434}
  # Used only by `graphrag demo seed` (make demo) for the demo accounts.
  DEMO_PASSWORD: ${GRAPHRAG_DEMO_PASSWORD:-}
  # The URL loader refuses private addresses unless this is true (development only).
  URL_FETCH_ALLOW_PRIVATE: ${GRAPHRAG_URL_FETCH_ALLOW_PRIVATE:-false}

x-api-image: &api-image
  build:
    context: ../..
    dockerfile: infra/docker/api.Dockerfile
  image: graphrag-api:local

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_DB: graphrag
      POSTGRES_USER: graphrag
      POSTGRES_PASSWORD: graphrag
    ports:
      - "127.0.0.1:${GRAPHRAG_PG_PORT:-5460}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphrag -d graphrag"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Embedding and query caches, build locks, rate limits and signed-out sessions. No eviction policy:
  # a revoked session must never be forgotten early.
  valkey:
    image: valkey/valkey:8.1.10-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${GRAPHRAG_REDIS_PORT:-6420}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    <<: *api-image
    environment:
      <<: *app-env
      MIGRATE_ON_BOOT: "true"
    ports:
      - "127.0.0.1:${GRAPHRAG_API_PORT:-8200}:8080"
    tmpfs:
      - /tmp:uid=10001,gid=10001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # Parses documents, extracts entities and relations and builds communities, taking jobs from
  # the queue. The
  # health check reads the worker's metrics endpoint, so it reflects the worker process.
  worker:
    <<: *api-image
    command: ["python", "-m", "graphrag.worker"]
    environment:
      <<: *app-env
      WORKER_METRICS_PORT: "9200"
    tmpfs:
      - /tmp:uid=10001,gid=10001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9200/metrics', timeout=2)
      interval: 15s
      timeout: 3s
      start_period: 40s
      retries: 3
    depends_on:
      # The API applies the migrations on boot; the worker starts once they are in.
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    image: graphrag-web:local
    environment:
      # The browser calls the API directly, so this is the host-facing address.
      API_URL: http://localhost:${GRAPHRAG_API_PORT:-8200}
      PRODUCT_NAME: ${GRAPHRAG_PRODUCT_NAME:-Euron GraphRAG}
    ports:
      - "127.0.0.1:${GRAPHRAG_WEB_PORT:-3200}:8080"
    restart: unless-stopped

volumes:
  pgdata:
